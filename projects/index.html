<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部项目 - 贵志的猫</title>
  <meta name="description" content="XMGZ 全部开源项目一览">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
    :root {
      --bg: #f8f6f1;
      --bg2: #ffffff;
      --bg3: #f0ece4;
      --text: #2c2c2c;
      --text-secondary: #6b6357;
      --text-muted: #a09888;
      --accent: #c8553d;
      --accent2: #5a7d6a;
      --accent3: #4a6fa5;
      --sakura: #f4b4c6;
      --sakura-light: rgba(244,180,198,0.15);
      --border: #e8e2d8;
      --shadow: 0 2px 12px rgba(44,44,44,0.06);
      --shadow-hover: 0 8px 30px rgba(44,44,44,0.1);
      --radius: 16px;
      --serif: 'Noto Serif SC', 'Songti SC', serif;
      --sans: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(244,180,198,0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(90,125,106,0.04) 0%, transparent 40%);
      pointer-events: none;
      z-index: -1;
    }
    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent2); }
    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* Hero */
    .page-hero {
      padding: 100px 24px 48px;
      text-align: center;
      background: linear-gradient(180deg, #f8f6f1 0%, #efe9dd 100%);
      border-bottom: 1px solid var(--border);
    }
    .page-hero h1 {
      font-family: var(--serif);
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .page-hero p {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 560px;
      margin: 0 auto 24px;
      line-height: 1.8;
    }
    .page-nav {
      display: flex;
      justify-content: center;
      gap: 24px;
    }
    .page-nav a {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      transition: 0.2s;
    }
    .page-nav a:hover { color: var(--accent); }

    /* Project rows */
    .projects-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 48px 0 80px;
    }
    .project-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 20px;
      align-items: center;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: all 0.3s ease;
    }
    .project-row:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }
    .project-row-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    .project-row-info h3 {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .project-row-info p {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .project-row-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ptag {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: var(--bg3);
      color: var(--text-secondary);
    }
    .ptag-accent { background: var(--sakura-light); color: var(--accent); }
    .project-row-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .project-row-actions a {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      transition: all 0.25s;
      letter-spacing: 0.5px;
    }
    .btn-gh {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-gh:hover { border-color: var(--accent); color: var(--accent); }
    .btn-play {
      background: var(--accent2);
      color: #fff;
      border: none;
    }
    .btn-play:hover { background: #4e6d5e; color: #fff; }

    @media (max-width: 768px) {
      .page-hero h1 { font-size: 28px; }
      .project-row { grid-template-columns: 1fr; gap: 12px; }
      .project-row-icon { display: none; }
      .project-row-actions { flex-direction: row; }
    }
  </style>
</head>
<body>

  <section class="page-hero">
    <h1>全部项目</h1>
    <p>涵盖 AI、全栈开发、游戏、DevOps、移动端等多个技术领域</p>
    <div class="page-nav">
      <a href="/">返回主页</a>
      <a href="documentation.html">文档中心</a>
      <a href="https://github.com/xmgzxmgz?tab=repositories" target="_blank">GitHub 全部仓库</a>
    </div>
  </section>

  <div class="container">
    <div class="projects-list">

      
        <div class="project-row-actions">
          <a href="https://github.com/xmgzxmgz/Flux" target="_blank" class="btn-gh">GitHub</a>
          <a href="https://github.com/xmgzxmgz/Flux#readme" target="_blank" class="btn-gh">文档</a>
          <a href="flux/" class="btn-play">Live Demo</a>
        </div>
      </div>

      
        <div class="project-row-actions">
      </div>

      <div class="project-row">
        <div class="project-row-icon" style="background:linear-gradient(135deg,#27ae60,#2ecc71);">🏘️</div>
        <div class="project-row-info">
          <h3>HQC K-Means 分析</h3>
          <p>基于 K-Means 聚类算法的住房与就业数据分析看板，交互式地图和图表展示聚类结果。</p>
          <div class="project-row-tags">
            <span class="ptag ptag-accent">TypeScript</span>
            <span class="ptag">React</span>
            <span class="ptag">K-Means</span>
            <span class="ptag">Leaflet</span>
          </div>
        </div>
        <div class="project-row-actions">
          <a href="https://github.com/xmgzxmgz/hqc_kmeans" target="_blank" class="btn-gh">GitHub</a>
          <a href="hqc-kmeans/" class="btn-play">Live Demo</a>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <span style="font-size:24px;display:block;margin-bottom:8px;">🐱</span>
    <p>&copy; 2026 贵志的猫</p>
  </footer>
</body>
</html>
