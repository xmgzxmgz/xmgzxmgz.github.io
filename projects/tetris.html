<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TETRIS-99 - 在线试玩</title>
  <meta name="description" content="TETRIS-99 网页版俄罗斯方块，在线畅玩 AI 对战模式">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8f6f1;
      color: #2c2c2c;
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif;
    }
    .header {
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(248,246,241,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 56px;
      border-bottom: 1px solid #e8e2d8;
    }
    .header a {
      color: #c8553d;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s;
    }
    .header a:hover { color: #5a7d6a; }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-right: auto;
      color: #2c2c2c;
    }
    .game-frame {
      width: 100%;
      height: calc(100vh - 56px);
      border: none;
      margin-top: 56px;
    }
    @media (max-width: 768px) {
      .header h1 { font-size: 14px; }
      .header { padding: 0 16px; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/">&larr; 返回主页</a>
    <h1>🎮 TETRIS-99 在线试玩</h1>
    <a href="https://github.com/xmgzxmgz/TETRIS-99" target="_blank">GitHub &rarr;</a>
  </div>
  <iframe class="game-frame" src="https://xmgzxmgz.github.io/TETRIS-99/"></iframe>
</body>
</html>
